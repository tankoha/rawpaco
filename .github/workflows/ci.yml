name: CI

on:
  push:
  pull_request:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install FPC
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fpc

      - name: Build (vendor objects + rawpaco)
        run: make

      - name: Run bootstrap self-check
        run: ./src/rawpaco

      - name: Run rule sample tests
        run: make test

      - name: Self-lint (CLAUDE.md rule 4)
        run: make selflint

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # chocoのインストール自体はマシン全体のPATH(レジストリ)を更新するが、
      # GitHub Actionsは各ステップを新規プロセスとして起動するため、その変更は
      # 同じジョブ内の後続ステップには自動反映されない。$GITHUB_PATHへの明示
      # 追記が必要（実際に初回CI実行で `fpc: command not found` として顕在化した）。
      #
      # chocoの freepascal パッケージは64bit OS向けにwin64クロスコンパイラ
      # (ppcx64.exe)も追加インストールしようとするが、共有のsetup.infの
      # コンポーネント指定がこの追加インストーラのコンポーネントIDと一致せず
      # 実際にはppcx64.exeが配置されない。単機能のwin64クロスコンパイラ
      # 追加インストーラ(fpc-3.2.2.i386-win32.cross.x86_64-win64.exe)を
      # 直接取得しサイレントインストールする方式も試したが、Windows実機が
      # なくサイレントインストール引数の検証ができず、インストール後も
      # ppcx64.exeが見つからなかった（詳細はHANDOFF.md参照）。64bit側を
      # 追いかけるのを諦め、確実に存在する32bit版(ppc386.exe)にgcc側を
      # 合わせる。--x86 で mingw パッケージにも32bit(i686)ビルドを
      # ダウンロードさせる。
      #
      # なお、その後判明した残課題(内部リンカのクラッシュ等)は32bit固有の
      # 問題ではなく、FPC 3.2.2ではwin64も既定で同じ内部リンカを使うため、
      # 64bitに移行しても同じ対処(-Xe等)が必要になる見込みである。
      # 32bitのままで全て解決済みなので64bit化は追わない。
      - name: Install FPC and MinGW (gcc)
        shell: pwsh
        run: |
          choco install -y freepascal mingw --x86

          $fpcExe = Get-ChildItem -Path 'C:\tools\freepascal' -Filter fpc.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $fpcExe) { throw "fpc.exe not found under C:\tools\freepascal after chocolatey install" }
          Add-Content -Path $env:GITHUB_PATH -Value $fpcExe.DirectoryName

          $gccExe = Get-ChildItem -Path 'C:\ProgramData\mingw64' -Filter gcc.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $gccExe) { throw "gcc.exe not found under C:\ProgramData\mingw64 after chocolatey install" }
          Add-Content -Path $env:GITHUB_PATH -Value $gccExe.DirectoryName

          # FPC自身のリンカ(ld.exe)はgccのように暗黙のデフォルトライブラリ
          # (libgcc, libmingwex, libmingw32, CRT, kernel32等)を自動追加しない
          # ため、vendorのCソースが使うシンボル(malloc/memcpy/QueryPerformance
          # Counter等)がリンクできず「Undefined symbol」になる（4回目CI成功後
          # の5回目実行で確認済み）。該当する.aファイルの実際の設置場所を
          # 検索し、-Fl（ライブラリ検索パス）として後続ステップに渡す。
          $mingwRoot = Split-Path -Parent (Split-Path -Parent $gccExe.DirectoryName)
          $libDirs = Get-ChildItem -Path $mingwRoot -Include 'libmingwex.a','libmingw32.a','libgcc.a','libkernel32.a','libucrt.a','libmsvcrt.a','libwinpthread.a' -Recurse -ErrorAction SilentlyContinue |
            ForEach-Object { $_.DirectoryName } | Sort-Object -Unique
          if (-not $libDirs) { throw "no mingw runtime import libraries (libmingwex.a etc.) found under $mingwRoot" }
          Add-Content -Path $env:GITHUB_ENV -Value "MINGW_LIB_DIRS=$($libDirs -join ';')"

          # choco版freepascalのデフォルトのユニット検索パスには、rtl-generics
          # 等のパッケージサブディレクトリが含まれていない模様（最初は
          # "Can't find unit Generics.Collections"、個別に-Fuで足すと今度は
          # 依存先の"Can't find unit Variants"と芋づる式に不足が発覚した）。
          # Linux(apt版)のfpc.cfgはunits/$fpctarget/*というワイルドカードで
          # 全パッケージサブディレクトリを自動的に検索パスに含めているため、
          # 同じ方式(ワイルドカード)をchoco版にも適用し、パッケージ単位で
          # 個別に対処するのをやめる。rtl-genericsディレクトリの親
          # (units\i386-win32)がfpctarget相当のディレクトリなので、そこに
          # \*を付けて全パッケージサブディレクトリを一括で検索パスに含める。
          $genericsUnit = Get-ChildItem -Path 'C:\tools\freepascal' -Include 'generics.collections.ppu','generics.collections.pas' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $genericsUnit) { throw "generics.collections.ppu/.pas not found under C:\tools\freepascal" }
          $fpcUnitsRoot = Split-Path -Parent $genericsUnit.DirectoryName
          Add-Content -Path $env:GITHUB_ENV -Value "FPC_UNITS_ROOT=$fpcUnitsRoot"

      # win32_atexit_shim.c は Windows でのみ必要。UCRT版mingw-w64が
      # プレーンな`atexit`シンボルをどのライブラリにも持たないことへの対処
      # （理由は src/TSBindings.pas と HANDOFF.md を参照）。
      - name: Build vendor objects
        shell: bash
        run: |
          mkdir -p build
          gcc -c vendor/tree-sitter/src/lib.c -I vendor/tree-sitter/include -I vendor/tree-sitter/src -o build/tree-sitter.o
          gcc -c vendor/tree-sitter-pascal/src/parser.c -I vendor/tree-sitter-pascal/src -I vendor/tree-sitter/include -o build/tree-sitter-pascal.o
          gcc -c src/win32_atexit_shim.c -o build/win32_atexit_shim.o

      # fpc に渡す各オプションの理由（いずれもWindows CIの実機検証で確定。
      # 経緯の詳細は HANDOFF.md 参照）:
      #
      #   -Xe   FPCのwin32ターゲットは既定で内部リンカ(ld_int_windows)を使うが、
      #         3.2.2の内部リンカは本プロジェクトのリンクを最後まで通すと
      #         EAccessViolationでコンパイラごとクラッシュする。外部のld.exe
      #         (chocoのfreepascalに同梱)に切り替えると解消する。あわせて、
      #         内部リンカが無視していた -k オプションが有効になる。
      #
      #   -k<obj>  atexitシムのオブジェクトをldへ直接渡す。{$L}で埋め込むと
      #         FPC自身がCOFFを解析する経路に入りクラッシュするため使えない。
      #
      #   -k--allow-multiple-definition
      #         FPCのsysinitpas.oとmingwのlibmingw32.a(tlssup.o)が双方
      #         `_tls_used`(TLSディレクトリ)を定義するため。先に現れる
      #         FPC側の定義が採用される。tlssup.o自体は`.tls`セクションと
      #         `___tls_start__`/`___tls_end__`の供給源としてFPC側から必要
      #         とされるので、アーカイブから取り除く方法は使えない
      #         （試したところ「defined in discarded section `.tls'」で失敗）。
      #
      #   -k--strip-debug
      #         mingwのランタイムオブジェクトがDWARF5デバッグ情報を持ち込み、
      #         VMA 0 の .debug_* セクションがPEセクションテーブルに残る。
      #         この状態のexeはWindowsローダに拒否され、起動しようとすると
      #         ENOEXEC(「Exec format error」)になる。デバッグ情報を落とすと
      #         正常に起動する。
      - name: Build rawpaco
        shell: bash
        run: |
          FL_ARGS=()
          IFS=';' read -ra DIRS <<< "$MINGW_LIB_DIRS"
          for d in "${DIRS[@]}"; do
            FL_ARGS+=("-Fl$d")
          done
          fpc -Xe -kbuild/win32_atexit_shim.o -k--allow-multiple-definition -k--strip-debug -Fusrc/Rules "-Fu$FPC_UNITS_ROOT/*" "${FL_ARGS[@]}" src/rawpaco.lpr

      - name: Run bootstrap self-check
        shell: bash
        run: ./src/rawpaco.exe

      - name: Run rule sample tests
        shell: bash
        run: bash tests/run_tests.sh

      - name: Self-lint (CLAUDE.md rule 4)
        shell: bash
        # --fail-on=warning(設計書4.1.4節): 重要度別終了コード制御の既定は
        # 寛容になったため、自己lintは明示的に激辛モードを指定して従来通り
        # 診断1件でも失敗する方針を維持する(Makefileのselflintターゲットと
        # 同じ理由。Linux側はmake selflint経由なのでそちらに実装済み)。
        run: ./src/rawpaco.exe --fail-on=warning src/*.pas src/Rules/*.pas src/rawpaco.lpr
