name: CI

on:
  push:
  pull_request:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install FPC
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fpc

      - name: Build (vendor objects + rawpaco)
        run: make

      - name: Run bootstrap self-check
        run: ./src/rawpaco

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # chocoのインストール自体はマシン全体のPATH(レジストリ)を更新するが、
      # GitHub Actionsは各ステップを新規プロセスとして起動するため、その変更は
      # 同じジョブ内の後続ステップには自動反映されない。$GITHUB_PATHへの明示
      # 追記が必要（実際に初回CI実行で `fpc: command not found` として顕在化した）。
      - name: Install FPC and MinGW (gcc)
        shell: pwsh
        run: |
          choco install -y freepascal mingw

          $fpcExe = Get-ChildItem -Path 'C:\tools\freepascal' -Filter fpc.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $fpcExe) { throw "fpc.exe not found under C:\tools\freepascal after chocolatey install" }
          Add-Content -Path $env:GITHUB_PATH -Value $fpcExe.DirectoryName

          $gccExe = Get-ChildItem -Path 'C:\ProgramData\mingw64' -Filter gcc.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $gccExe) { throw "gcc.exe not found under C:\ProgramData\mingw64 after chocolatey install" }
          Add-Content -Path $env:GITHUB_PATH -Value $gccExe.DirectoryName

      - name: Build vendor objects
        shell: bash
        run: |
          mkdir -p build
          gcc -c vendor/tree-sitter/src/lib.c -I vendor/tree-sitter/include -I vendor/tree-sitter/src -o build/tree-sitter.o
          gcc -c vendor/tree-sitter-pascal/src/parser.c -I vendor/tree-sitter-pascal/src -I vendor/tree-sitter/include -o build/tree-sitter-pascal.o

      - name: Build rawpaco
        shell: bash
        run: fpc src/rawpaco.lpr

      - name: Run bootstrap self-check
        shell: bash
        run: ./src/rawpaco.exe
